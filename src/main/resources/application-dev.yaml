spring:
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

decorator:
  datasource:
    p6spy:
      enable-logging: false
      logging: slf4j
      multiline: true
