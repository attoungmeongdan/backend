services:
  app:
    image: ${DOCKERHUB_USERNAME}/atmd-backend:latest
    container_name: atmd-app
    ports:
      - "127.0.0.1:8080:8080"   # 리버스 프록시(Nginx 등)가 같은 호스트에 있을 때만. 별도 서버라면 제거
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: atmd-postgres
    env_file:
      - .env.prod
    # ports 미노출 — 앱 컨테이너가 내부 네트워크로 직접 접근
    environment:
      POSTGRES_DB: ${DB_NAME:-atmd}
      POSTGRES_USER: ${DB_USER:-atmd}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-atmd} -d ${DB_NAME:-atmd}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: atmd-redis
    # ports 미노출 — 앱 컨테이너가 내부 네트워크로 직접 접근
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
